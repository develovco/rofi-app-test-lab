worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format matching the simulated attack logs
    # Includes X-Forwarded-For as the last field for forensic analysis
    log_format custom '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /opt/admin/logs/access.log custom;
    error_log  /opt/admin/logs/nginx_error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    upstream app_backend {
        server app:3000;
    }

    server {
        listen 80;
        server_name feedback.admin.local localhost;

        # Proxy all requests to Node.js backend
        location / {
            proxy_pass         http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;

            # Do not buffer responses (important for real-time feedback)
            proxy_buffering off;
        }
    }
}
